[project]
name = "comic-carousel-generator"
version = "0.1.0"
description = "Turns scanned hand-drawn comics into Instagram carousel PNGs. Classical machine vision, no AI."
requires-python = "==3.12.10"
dependencies = [
  "numpy==2.2.6",
  "opencv-python-headless==4.12.0.88",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.uv]
package = false
no-build = true
# Windows ARM64 is not listed: opencv-python-headless publishes no win_arm64 wheel.
required-environments = [
  "sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'win32' and platform_machine == 'AMD64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'linux' and platform_machine == 'aarch64'",
]
